name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: TasbihApp.zip ni ochish
        run: |
          unzip -o TasbihApp.zip -d extracted_app
          PUBSPEC_DIR=$(dirname "$(find extracted_app -maxdepth 3 -name pubspec.yaml | head -n 1)")
          echo "Topilgan loyiha papkasi: $PUBSPEC_DIR"
          cp -r "$PUBSPEC_DIR"/. .

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Android platform fayllarini yaratish
        run: flutter create . --platforms=android --project-name tasbih_app

      - name: Android compileSdk versiyasini eng soʻnggisiga moslashtirish
        run: |
          GRADLE_FILE="android/app/build.gradle.kts"
          if [ ! -f "$GRADLE_FILE" ]; then
            GRADLE_FILE="android/app/build.gradle"
          fi
          python3 -c "
import re
path = '$GRADLE_FILE'
text = open(path).read()
text = re.sub(r'compileSdk(Version)?\s*=?\s*flutter\.compileSdkVersion', 'compileSdk = 36', text)
text = re.sub(r'compileSdkVersion\s+\d+', 'compileSdkVersion 36', text)
text = re.sub(r'compileSdk\s*=\s*\d+', 'compileSdk = 36', text)
open(path, 'w').write(text)
"

      - name: Kutubxonalarni oʻrnatish
        run: flutter pub get

      - name: APK yigʻish
        run: flutter build apk --release

      - name: APK faylni yuklash
        uses: actions/upload-artifact@v4
        with:
          name: tasbih-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
