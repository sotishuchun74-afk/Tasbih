name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: TasbihApp.zip ni ochish
        run: |
          unzip -o TasbihApp.zip -d extracted_app
          PUBSPEC_DIR=$(dirname "$(find extracted_app -maxdepth 3 -name pubspec.yaml | head -n 1)")
          echo "Topilgan loyiha papkasi: $PUBSPEC_DIR"
          cp -r "$PUBSPEC_DIR"/. .

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Android platform fayllarini yaratish
        run: flutter create . --platforms=android --project-name tasbih_app

      - name: Android compileSdk versiyasini eng soʻnggisiga moslashtirish
        run: |
          GRADLE_FILE="android/app/build.gradle.kts"
          if [ ! -f "$GRADLE_FILE" ]; then
            GRADLE_FILE="android/app/build.gradle"
          fi
          sed -i -E 's/compileSdk(Version)?[[:space:]]*=?[[:space:]]*flutter\.compileSdkVersion/compileSdk = 36/' "$GRADLE_FILE"
          sed -i -E 's/compileSdkVersion[[:space:]]+[0-9]+/compileSdkVersion 36/' "$GRADLE_FILE"
          sed -i -E 's/compileSdk[[:space:]]*=[[:space:]]*[0-9]+/compileSdk = 36/' "$GRADLE_FILE"
          grep -in "compileSdk" "$GRADLE_FILE"

      - name: Kutubxonalarni oʻrnatish
        run: flutter pub get

      - name: APK yigʻish
        run: flutter build apk --release

      - name: APK faylni yuklash
        uses: actions/upload-artifact@v4
        with:
          name: tasbih-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
